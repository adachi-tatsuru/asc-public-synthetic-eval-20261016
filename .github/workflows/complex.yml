name: Synthetic complex acceptance
on: [pull_request]
permissions:
  contents: read
jobs:
  complex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node complex/oracle/reservation.mjs complex revised
          node complex/oracle/billing.mjs complex revised
          node complex/oracle/integration.mjs complex
          node complex/oracle/unknown-keys.mjs complex
          node complex/oracle/revision.mjs complex/previous complex
