name: Synthetic complex acceptance
on: [pull_request]
permissions:
  contents: read
jobs:
  complex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node complex/oracle/reservation.mjs complex
          node complex/oracle/billing.mjs complex
          node complex/oracle/integration.mjs complex
          node complex/oracle/unknown-keys.mjs complex
          node complex/oracle/accessors.mjs complex
          node complex/oracle/http.mjs complex
      - name: Install pinned browser driver
        run: |
          sudo mkdir -p /tools
          sudo chown "$USER" /tools
          npm install --prefix /tools --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          sudo mkdir -p /work
          sudo chown "$USER" /work
      - name: Visible journey
        run: node complex/oracle/browser.mjs complex
