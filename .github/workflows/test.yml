name: Synthetic fixture
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression tests
        run: python3 -I test_greeting.py
      - name: Independent acceptance oracle
        run: python3 -I -c 'import sys; sys.path.insert(0, "."); from greeting import greeting; assert greeting() == "Hello"'
