name: Synthetic Goal
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression and integration
        run: python3 -m unittest discover -v
      - name: Independent oracle
        run: python3 -I -c 'import sys; sys.path.insert(0,"."); from checkout import quote; assert quote(125,3,5)=={"total_cents":375,"remaining_stock":2}'
