<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic demo</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #172033;
      --surface: #ffffff;
      --muted: #5d6678;
      --border: #c8ced9;
      --accent: #3157c8;
      --error: #a21b2d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #eef2fa;
        --surface: #171a22;
        --muted: #b7bfce;
        --border: #4b5364;
        --accent: #9bb4ff;
        --error: #ff9baa;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-width: 0; overflow-x: hidden; }

    body {
      background: var(--surface);
      color: var(--text);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100%, 42rem);
      margin-inline: auto;
      padding: 1rem;
    }

    h1, h2, p { overflow-wrap: anywhere; }
    h1 { font-size: clamp(1.5rem, 8vw, 2.25rem); margin-block: 0 1rem; }
    h2 { font-size: 1.25rem; }

    label { display: block; font-weight: 650; margin-bottom: 0.35rem; }

    input, button {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      padding: 0.65rem 0.75rem;
    }

    input { width: 100%; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.65; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    #status { min-height: 1.5em; color: var(--muted); }
    #error { color: var(--error); font-weight: 650; }
    #tasks { list-style: none; margin: 1rem 0; padding: 0; }

    #tasks li {
      border-block-start: 1px solid var(--border);
      padding-block: 0.8rem;
    }

    #tasks li:last-child { border-block-end: 1px solid var(--border); }
    #tasks a { display: block; overflow-wrap: anywhere; }
    #detail { border: 1px solid var(--border); border-radius: 0.55rem; padding: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Synthetic demo</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>

    <section id="list-view" aria-labelledby="list-heading" hidden>
      <h2 id="list-heading">Tasks</h2>
      <label for="search">Search tasks</label>
      <input id="search" type="search" autocomplete="off">
      <ul id="tasks"></ul>
      <p id="empty" hidden>No matching tasks.</p>
    </section>

    <section id="detail" aria-labelledby="detail-name" hidden>
      <a id="back" href="#list">Back to tasks</a>
      <h2 id="detail-name"></h2>
      <p id="detail-state"></p>
      <button id="toggle" type="button" hidden></button>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const listView = document.querySelector("#list-view");
      const tasksElement = document.querySelector("#tasks");
      const search = document.querySelector("#search");
      const empty = document.querySelector("#empty");
      const detail = document.querySelector("#detail");
      const detailName = document.querySelector("#detail-name");
      const detailState = document.querySelector("#detail-state");
      const toggle = document.querySelector("#toggle");
      const status = document.querySelector("#status");
      const error = document.querySelector("#error");

      let tasks = [];
      let currentTask = null;
      let listLoaded = false;
      let pending = 0;
      let routeVersion = 0;
      let mutationInFlight = null;

      function setLoading(isStarting) {
        pending += isStarting ? 1 : -1;
        pending = Math.max(0, pending);
        status.textContent = pending > 0 ? "Loading" : "";
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      function clearError() {
        error.textContent = "";
        error.hidden = true;
      }

      async function request(path, options = {}) {
        setLoading(true);
        try {
          const response = await fetch(path, {
            ...options,
            headers: { "Content-Type": "application/json", ...(options.headers || {}) }
          });
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          return await response.json();
        } finally {
          setLoading(false);
        }
      }

      async function waitForMutation(version) {
        const mutation = mutationInFlight;
        if (mutation) {
          try {
            await mutation;
          } catch (requestError) {
            // The toggle handler reports the mutation failure to the user.
          }
        }
        return version === routeVersion;
      }

      function renderTasks() {
        const query = search.value.toLocaleLowerCase();
        const matches = tasks.filter((task) => task.name.toLocaleLowerCase().includes(query));
        tasksElement.replaceChildren();
        for (const task of matches) {
          const row = document.createElement("li");
          row.dataset.taskId = String(task.id);
          const link = document.createElement("a");
          link.href = `#task/${task.id}`;
          link.textContent = `${task.name} — ${task.completed ? "Completed" : "Not completed"}`;
          row.append(link);
          tasksElement.append(row);
        }
        empty.hidden = !listLoaded || matches.length !== 0;
      }

      function renderDetail(task) {
        currentTask = task;
        detail.dataset.taskId = String(task.id);
        detail.dataset.completed = String(task.completed);
        detailName.textContent = task.name;
        detailState.textContent = task.completed ? "Completed" : "Not completed";
        toggle.textContent = task.completed ? "Mark not completed" : "Mark completed";
        toggle.hidden = false;
        toggle.disabled = false;
      }

      async function showList(version) {
        listView.hidden = false;
        detail.hidden = true;
        currentTask = null;
        listLoaded = false;
        tasks = [];
        tasksElement.replaceChildren();
        empty.hidden = true;
        clearError();
        try {
          if (!await waitForMutation(version)) return;
          const result = await request("/api/tasks");
          if (version !== routeVersion) return;
          tasks = result;
          listLoaded = true;
          renderTasks();
        } catch (requestError) {
          if (version === routeVersion) showError("Could not load tasks. Please try again.");
        }
      }

      async function showDetail(id, version) {
        listView.hidden = true;
        detail.hidden = false;
        currentTask = null;
        delete detail.dataset.taskId;
        delete detail.dataset.completed;
        detailName.textContent = "Task";
        detailState.textContent = "";
        toggle.hidden = true;
        clearError();
        try {
          if (!await waitForMutation(version)) return;
          const task = await request(`/api/tasks/${id}`);
          if (version !== routeVersion) return;
          renderDetail(task);
        } catch (requestError) {
          if (version === routeVersion) showError("Could not load this task. Please return to the list and try again.");
        }
      }

      function route() {
        const version = ++routeVersion;
        const detailMatch = /^#task\/([1-9][0-9]*)$/.exec(location.hash);
        if (detailMatch) {
          showDetail(detailMatch[1], version);
          return;
        }
        if (location.hash !== "#list") {
          history.replaceState(null, "", "#list");
        }
        showList(version);
      }

      search.addEventListener("input", renderTasks);
      toggle.addEventListener("click", async () => {
        if (!currentTask) return;
        const taskAtClick = currentTask;
        toggle.disabled = true;
        clearError();
        const mutation = request(`/api/tasks/${taskAtClick.id}`, {
          method: "PATCH",
          body: JSON.stringify({ completed: !taskAtClick.completed })
        });
        mutationInFlight = mutation;
        try {
          const updated = await mutation;
          if (currentTask && currentTask.id === updated.id) renderDetail(updated);
        } catch (requestError) {
          if (currentTask && currentTask.id === taskAtClick.id) toggle.disabled = false;
          showError("Could not update this task. Its state was not changed here.");
        } finally {
          if (mutationInFlight === mutation) mutationInFlight = null;
        }
      });

      window.addEventListener("hashchange", route);
      route();
    })();
  </script>
</body>
</html>
